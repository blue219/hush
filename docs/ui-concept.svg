  <text x="646" y="207" class="small">你的每一次安静时刻</text>
  <rect x="642" y="231" width="216" height="105" rx="17" fill="#1B2E3D"/>
  <circle cx="690" cy="283" r="32" fill="url(#glow)"/><circle cx="690" cy="283" r="18" fill="none" stroke="#AFE5D6" stroke-width="1.7"/><circle cx="681" cy="273" r="2" fill="#BAEBDD"/><circle cx="703" cy="286" r="2" fill="#BAEBDD"/><circle cx="686" cy="299" r="2" fill="#BAEBDD"/>
