  <circle cx="1040" cy="298" r="68" fill="url(#glow)"/>
  <ellipse cx="1040" cy="299" rx="48" ry="32" fill="none" stroke="url(#particle)" stroke-width="2"/>
  <path d="M1001 311 Q1024 264 1063 284 Q1098 304 1062 330 Q1031 346 1006 316" fill="none" stroke="#ABDCCF" stroke-opacity=".5"/>
  <g fill="#B8E5D8"><circle cx="999" cy="301" r="2.5"/><circle cx="1017" cy="274" r="2"/><circle cx="1049" cy="270" r="2"/><circle cx="1083" cy="292" r="2.5"/><circle cx="1077" cy="322" r="2"/><circle cx="1040" cy="337" r="2.5"/><circle cx="1014" cy="321" r="2"/></g>
  <text x="950" y="373" font-size="13">▶</text><line x1="976" y1="369" x2="1127" y2="369" stroke="#607785" stroke-width="3" stroke-linecap="round"/><line x1="976" y1="369" x2="1034" y2="369" stroke="#A8E9D3" stroke-width="3" stroke-linecap="round"/><circle cx="1034" cy="369" r="5" fill="#A8E9D3"/>
  <text x="932" y="425" font-size="14" font-weight="600">状态趋势</text>
  <rect x="932" y="438" width="216" height="132" rx="15" fill="#1B2E3D"/>
  <g stroke="#385365" stroke-width=".7"><line x1="950" y1="466" x2="1131" y2="466"/><line x1="950" y1="495" x2="1131" y2="495"/><line x1="950" y1="524" x2="1131" y2="524"/></g>
  <polyline points="950,518 967,505 984,512 1001,491 1018,502 1035,481 1052,489 1069,470 1086,481 1103,460 1130,466" fill="none" stroke="#A8E9D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="950,493 967,487 984,495 1001,482 1018,489 1035,502 1052,491 1069,498 1086,484 1103,493 1130,481" fill="none" stroke="#B9AEE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="950" y="555" class="tiny">开始</text><text x="1110" y="555" class="tiny">结束</text>
  <circle cx="945" cy="590" r="3" fill="#A8E9D3"/><text x="953" y="594" class="tiny">相对趋势</text><circle cx="1028" cy="590" r="3" fill="#B9AEE6"/><text x="1036" y="594" class="tiny">身体活动</text>
  <text x="932" y="626" class="small">大部分时间保持稳定</text>

  <!-- Music -->
  <text x="1226" y="181" class="title">音乐</text>
  <text x="1226" y="207" class="small">选择陪伴你的声音</text>
  <rect x="1222" y="232" width="216" height="195" rx="18" fill="#24384B"/>
  <circle cx="1330" cy="311" r="61" fill="url(#glow)"/>
  <circle cx="1330" cy="311" r="38" fill="none" stroke="#A9DCCA" stroke-width="1.2"/>
  <circle cx="1330" cy="311" r="25" fill="none" stroke="#B8A9E5" stroke-width="1.2"/>
  <circle cx="1330" cy="311" r="11" fill="#93CDBF" fill-opacity=".7"/>
  <text x="1241" y="390" font-size="14" font-weight="600">深海呼吸</text><text x="1241" y="411" class="small">柔和环境音 · 20 分钟</text>
  <text x="1224" y="456" class="small">为你推荐</text>
  <rect x="1222" y="471" width="216" height="58" rx="13" fill="#1B2E3D"/>
  <circle cx="1251" cy="500" r="17" fill="#385B65"/><path d="M1241 501 Q1251 489 1261 501" fill="none" stroke="#A8E9D3" stroke-width="1.5"/><text x="1280" y="495" font-size="12">林间雨声</text><text x="1280" y="514" class="tiny">自然声音 · 30 分钟</text>
  <rect x="1222" y="538" width="216" height="58" rx="13" fill="#1B2E3D"/>
  <circle cx="1251" cy="567" r="17" fill="#4A4B68"/><path d="M1243 571 Q1251 554 1259 571" fill="none" stroke="#C8B9E9" stroke-width="1.5"/><text x="1280" y="562" font-size="12">夜晚微光</text><text x="1280" y="581" class="tiny">舒缓旋律 · 15 分钟</text>
  <rect x="1222" y="612" width="216" height="42" rx="13" fill="#294458"/>
  <text x="1236" y="638" font-size="11">深海呼吸</text><text x="1400" y="638" font-size="15">Ⅱ</text>

