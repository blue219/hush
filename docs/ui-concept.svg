  <rect x="642" y="349" width="216" height="95" rx="17" fill="#1B2E3D"/>
  <circle cx="690" cy="396" r="30" fill="url(#glow)"/><circle cx="690" cy="396" r="17" fill="none" stroke="#B9B6E6" stroke-width="1.6"/><circle cx="684" cy="381" r="2" fill="#C9C5EC"/><circle cx="703" cy="402" r="2" fill="#C9C5EC"/>
  <text x="729" y="379" font-size="13" font-weight="600">昨天  21:15</text><text x="729" y="401" class="small">15 分钟 · 渐入佳境</text><text x="729" y="425" class="tiny">查看回溯和分析  ›</text>
  <rect x="642" y="457" width="216" height="95" rx="17" fill="#1B2E3D"/>
  <circle cx="690" cy="504" r="30" fill="url(#glow)"/><circle cx="690" cy="504" r="17" fill="none" stroke="#A5CDE5" stroke-width="1.6"/><circle cx="682" cy="493" r="2" fill="#C2DCE9"/><circle cx="700" cy="513" r="2" fill="#C2DCE9"/>
  <text x="729" y="487" font-size="13" font-weight="600">9 月 20 日  08:00</text><text x="729" y="509" class="small">10 分钟 · 略有波动</text><text x="729" y="533" class="tiny">查看回溯和分析  ›</text>

  <!-- Detail -->
