<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1500 750" role="img" aria-label="Hush meditation app UI concept: meditation, completion, history, session detail, and music">
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#15243A"/></linearGradient>
    <linearGradient id="particle" x2="1" y2="1"><stop stop-color="#A5E8D2"/><stop offset="0.5" stop-color="#9CC7EC"/><stop offset="1" stop-color="#C8ACEB"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8CDACF" stop-opacity=".38"/><stop offset=".52" stop-color="#82ADD3" stop-opacity=".13"/><stop offset="1" stop-color="#82ADD3" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #EAF2F3; }
      .label { font-size: 16px; font-weight: 600; fill: #B9CBD3; letter-spacing: 1px; }
      .title { font-size: 19px; font-weight: 600; }
      .small { font-size: 11px; fill: #A9BDC6; }
      .tiny { font-size: 9px; fill: #8FA4AF; }
      .metric { font-size: 14px; font-weight: 600; }
      .nav { font-size: 10px; fill: #829AA5; }
      .active { fill: #A8E9D3; }
    </style>
  </defs>

  <rect width="1500" height="750" fill="url(#background)"/>
  <text x="45" y="48" font-size="26" font-weight="700">Hush</text>
  <text x="130" y="48" font-size="16" fill="#A9BDC6">移动端界面布局草图</text>
  <text x="45" y="82" class="small">3 个主模块 · 冥想完成后进入结果页 · 历史中回看单次数据与粒子变化</text>

  <!-- Screen frames -->
  <g fill="#101C2B" stroke="#3E5361" stroke-width="1.5">
    <rect x="43" y="132" width="254" height="572" rx="30"/>
    <rect x="333" y="132" width="254" height="572" rx="30"/>
    <rect x="623" y="132" width="254" height="572" rx="30"/>
    <rect x="913" y="132" width="254" height="572" rx="30"/>
    <rect x="1203" y="132" width="254" height="572" rx="30"/>
  </g>
  <g class="label"><text x="43" y="119">01  冥想中</text><text x="333" y="119">02  完成页</text><text x="623" y="119">03  历史记录</text><text x="913" y="119">04  单次详情</text><text x="1203" y="119">05  音乐</text></g>
  <g fill="#304353"><rect x="136" y="139" width="68" height="5" rx="3"/><rect x="426" y="139" width="68" height="5" rx="3"/><rect x="716" y="139" width="68" height="5" rx="3"/><rect x="1006" y="139" width="68" height="5" rx="3"/><rect x="1296" y="139" width="68" height="5" rx="3"/></g>

  <!-- Meditation -->
  <text x="66" y="181" class="title">正在冥想</text>
  <circle cx="74" cy="205" r="4" fill="#A8E9D3"/><text x="85" y="209" class="small">Muse 已连接</text>
  <path d="M262 177 L262 194 M254 180 L254 191 M270 180 L270 191" stroke="#B8D4D8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="170" cy="342" r="105" fill="url(#glow)"/>
  <circle cx="170" cy="342" r="62" fill="none" stroke="url(#particle)" stroke-opacity=".2" stroke-width="25" filter="url(#blur)"/>
  <circle cx="170" cy="342" r="61" fill="none" stroke="url(#particle)" stroke-width="2" stroke-opacity=".62"/>
  <path d="M105 339 C127 296 204 290 232 341 C247 380 195 402 157 390 C112 377 111 329 145 312" fill="none" stroke="url(#particle)" stroke-width="1.5" stroke-opacity=".5"/>
  <g fill="#B6E8DB"><circle cx="106" cy="325" r="3"/><circle cx="121" cy="287" r="2"/><circle cx="144" cy="301" r="2.5"/><circle cx="160" cy="280" r="2"/><circle cx="192" cy="295" r="3"/><circle cx="225" cy="320" r="2.5"/><circle cx="231" cy="350" r="2"/><circle cx="204" cy="385" r="3"/><circle cx="173" cy="398" r="2"/><circle cx="132" cy="373" r="2.5"/><circle cx="114" cy="351" r="2"/><circle cx="190" cy="346" r="2"/><circle cx="153" cy="339" r="2"/></g>
  <g fill="#C9B6ED"><circle cx="132" cy="311" r="2"/><circle cx="216" cy="361" r="2"/><circle cx="181" cy="307" r="1.8"/><circle cx="151" cy="389" r="1.8"/></g>
  <text x="170" y="456" text-anchor="middle" font-size="34" font-weight="300">12:36</text>
  <text x="170" y="479" text-anchor="middle" class="small">让呼吸自然流动</text>
  <rect x="68" y="523" width="93" height="45" rx="22" fill="#233747"/><text x="114" y="551" text-anchor="middle" font-size="13">暂停</text>
  <rect x="172" y="523" width="103" height="45" rx="22" fill="#B5E6D8"/><text x="223" y="551" text-anchor="middle" font-size="13" fill="#173039">结束</text>
  <text x="170" y="601" text-anchor="middle" class="small">上滑查看实时趋势</text>

  <!-- Completion -->
  <text x="356" y="181" class="title">本次冥想</text>
  <text x="356" y="207" class="small">今天  ·  20 分钟</text>
  <circle cx="460" cy="333" r="91" fill="url(#glow)"/>
  <circle cx="460" cy="333" r="62" fill="#1D3342" stroke="#9BDCCD" stroke-width="2"/>
  <path d="M432 317 Q438 311 444 317 M476 317 Q482 311 488 317" fill="none" stroke="#CAEBDD" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M437 345 Q460 362 483 345" fill="none" stroke="#CAEBDD" stroke-width="2.5" stroke-linecap="round"/>
  <text x="460" y="431" text-anchor="middle" font-size="19" font-weight="600">平稳而专注</text>
  <text x="460" y="456" text-anchor="middle" class="small">后半段变化较小</text>
  <rect x="354" y="484" width="212" height="61" rx="16" fill="#1A2A39"/>
  <text x="378" y="508" class="tiny">相对稳定时段</text><text x="378" y="531" class="metric">12 分钟</text>
  <text x="481" y="508" class="tiny">平均心率</text><text x="481" y="531" class="metric">68 bpm</text>
  <rect x="354" y="574" width="212" height="45" rx="22" fill="#B5E6D8"/><text x="460" y="602" text-anchor="middle" font-size="13" fill="#173039">查看详情</text>
  <text x="460" y="650" text-anchor="middle" class="small">完成</text>

